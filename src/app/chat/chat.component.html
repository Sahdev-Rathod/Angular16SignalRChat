<div class="chat-container">

  <h2>Real-Time Chat</h2>

  <div class="user-section">

    <input
      type="text"
      [(ngModel)]="userName"
      placeholder="Enter your name"
    />

  </div>

  <div class="messages">

    <div
      class="message"
      *ngFor="let item of messages">

      <strong>
        {{ item.userName }}
      </strong>

      <span>
        : {{ item.message }}
      </span>

      <small>
        {{ item.sentAt | date:'shortTime' }}
      </small>

    </div>

  </div>

  <div class="message-section">

    <input
      type="text"
      [(ngModel)]="message"
      placeholder="Enter message"
      (keyup.enter)="sendMessage()"
    />

    <button
      (click)="sendMessage()">
      Send
    </button>

  </div>

</div>
